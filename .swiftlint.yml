# SwiftLint configuration for NPO light.
#
# Policy (see AGENTS.md): this file contains NO `disabled_rules` and NO
# `excluded` paths, and the code base contains no `// swiftlint:disable`
# comments. Every rule applies to every Swift file, and CI runs SwiftLint
# with `--strict`, so a warning is a build failure.
#
# Weakening the rule set -- disabling a rule, excluding a path, relaxing a
# threshold or adding an inline disable comment -- requires explicit written
# approval from the repository owner in the pull request, plus an ADR under
# docs/adr/ recording the reason. `scripts/check-lint-exceptions.sh` fails
# the build when an exception sneaks in.

included:
  - NPO light
  - NPO lightTests
  - NPO lightUITests

# Rules that are not on by default but that we want enforced.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

reporter: xcode
