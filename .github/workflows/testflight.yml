name: TestFlight

# Uploads master to App Store Connect for the internal TestFlight testers
# (docs/adr/0029-hand-out-the-app-through-internal-testflight.md). It runs when
# started by hand and once a month, so that a build is never older than
# TestFlight's ninety days. Never on a pull request: the job holds the App
# Store Connect key, and code from a pull request must not run beside it.

on:
  workflow_dispatch:
  schedule:
    # 06:17 UTC on the first of the month.
    - cron: "17 6 1 * *"

# One upload at a time, and never cancel one halfway.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload to TestFlight
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show the toolchain in use
        run: xcodebuild -version

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -z "${ASC_KEY_P8}" ]]; then
            echo "::error::The ASC_KEY_P8 secret is not set."
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "${ASC_KEY_P8}" >"${key_path}"
          chmod 600 "${key_path}"
          echo "ASC_KEY_PATH=${key_path}" >>"${GITHUB_ENV}"

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/upload-testflight.sh

      - name: Remove the App Store Connect key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/AuthKey.p8"
