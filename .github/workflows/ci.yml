name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

# One run per branch: a new push cancels the run that is already in flight.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify that no lint exceptions were added
        run: ./scripts/check-lint-exceptions.sh

      - name: Install the latest SwiftLint
        run: |
          brew update
          if brew list --formula swiftlint >/dev/null 2>&1; then
            brew upgrade swiftlint
          else
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint (strict, warnings are errors)
        run: ./scripts/lint.sh

  build:
    name: Build (no warnings allowed)
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show the toolchain in use
        run: |
          xcodebuild -version
          swift --version

      - name: Build for tvOS Simulator
        run: ./scripts/build.sh

  test:
    name: Test
    runs-on: macos-26
    needs: build
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show the toolchain in use
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run unit and UI tests
        run: ./scripts/test.sh

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
