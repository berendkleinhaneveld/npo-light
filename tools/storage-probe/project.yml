name: StorageProbe
options:
  deploymentTarget:
    tvOS: "26.2"
targets:
  StorageProbe:
    type: application
    platform: tvOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bearduck.NPOLightStorageProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NPO Storage Probe
        SWIFT_VERSION: "5.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_STYLE: Automatic
